<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SCHOOL.EXE - Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
      <p style="font-size:0.72rem;color:#00aa00;margin-top:6px;letter-spacing:1px;">MS-DOS Version 6.22 &nbsp;|&nbsp; Copyright (C) Mergington Corp 1993&nbsp;&nbsp;<span style="animation:blink 1s infinite;display:inline-block;">&#9608;</span></p>
    </header>

    <main>
      <section id="activities-container" data-title=" ACTIVITIES.DAT ">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container" data-title=" ENROLL.EXE ">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>2023 Mergington High School &nbsp;|&nbsp; SCHOOL.EXE v1.0</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
